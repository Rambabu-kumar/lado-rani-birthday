<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OUR SECRET PLACE ❤️</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/gallery.css" />
</head>
<body data-page="secret.html">
  <nav class="page-nav" data-nav-root></nav>
  <main class="page-shell">
    <div class="container gallery-page">
      <div class="section-title" style="text-align:center;">OUR SECRET PLACE ❤️</div>
      <p class="subtitle" style="text-align:center;">Some memories are just for us...</p>
      <div id="locked-state" class="lock-state lock-box secret-lockbox">
        <div class="lock-icon">🔒</div>
        <h3>Only for us, Risha ❤️</h3>
        <form id="gallery-password-form">
          <input id="gallery-password" class="gallery-input" type="password" placeholder="Enter password" aria-label="Gallery password" />
          <button class="button" type="submit">Unlock Gallery</button>
        </form>
        <p id="password-error" class="subtitle" style="color:#b24662; margin-top:8px; min-height:20px;"></p>
      </div>
      <div id="unlocked-state" class="hidden">
        <div class="panel" style="padding:22px;">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
            <h3 class="category-title" style="margin:0;">Secret Gallery</h3>
            <button id="lock-gallery" class="button secondary" type="button">Lock Gallery 🔒</button>
          </div>
          <div class="category-section">
            <h3 class="category-title">Category 1: Cute Memories 🥰</h3>
            <div id="secret-cute-grid" class="photo-grid"></div>
          </div>
          <div class="category-section">
            <h3 class="category-title">Category 2: Romantic Memories ❤️</h3>
            <div id="secret-romantic-grid" class="photo-grid"></div>
          </div>
        </div>
      </div>
      <div id="lightbox" class="lightbox">
        <div class="lightbox-content">
          <button id="close-lightbox" type="button" class="button secondary" style="position:absolute;top:12px;right:12px;">Close</button>
          <div class="lightbox-nav"><button type="button" id="prev-photo">←</button><button type="button" id="next-photo">→</button></div>
          <img id="lightbox-img" src="" alt="" />
          <div id="lightbox-caption" class="lightbox-caption"></div>
        </div>
      </div>
    </div>
  </main>
  <script src="js/navigation.js"></script>
  
  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/personal-media.js"></script>
  <script src="js/gallery.js"></script>
  
</body>
</html>
