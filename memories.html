<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Beautiful Memories 📸</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/gallery.css" />
</head>
<body data-page="memories.html">
  <nav class="page-nav" data-nav-root></nav>
  <main class="page-shell memories-page">
    <div class="container">
      <header class="memory-header">
        <span class="memory-eyebrow">A LITTLE ALBUM OF US</span>
        <h1 class="section-title">Our Beautiful Memories 📸</h1>
        <p class="memory-intro">Every picture keeps a little piece of our story. Choose a moment and relive it together.</p>
      </header>

      <section class="memory-viewer" aria-label="Memory slideshow">
        <div id="memories-photo-grid" class="memory-stage"></div>
        <div class="memory-controls">
          <button id="prev-memory" class="button secondary memory-control" type="button" aria-label="Previous memory">← Previous</button>
          <div class="memory-meta" aria-live="polite">
            <p id="memory-caption" class="memory-caption">A favorite memory with Risha 1</p>
            <span id="memory-count" class="memory-count">01 / 12</span>
          </div>
          <button id="next-memory" class="button memory-control" type="button" aria-label="Next memory">Next →</button>
        </div>
        <div class="memory-progress" aria-hidden="true"><span id="memory-progress"></span></div>
      </section>
      <p class="memory-hint">Tap a photo to see it up close ✨</p>
    </div>

    <div id="lightbox" class="lightbox" aria-hidden="true">
      <div class="lightbox-content">
        <button id="close-lightbox" type="button" class="button secondary" style="position:absolute;top:12px;right:12px;">Close</button>
        <div class="lightbox-nav">
          <button type="button" id="prev-photo" aria-label="Previous photo">←</button>
          <button type="button" id="next-photo" aria-label="Next photo">→</button>
        </div>
        <img id="lightbox-img" src="" alt="" />
        <div id="lightbox-caption" class="lightbox-caption"></div>
      </div>
    </div>
  </main>
  <script src="js/navigation.js"></script>
  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/personal-media.js"></script>
</body>
</html>
