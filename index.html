<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Risha ❤️</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/gallery.css" />
</head>
<body data-page="index.html">
  <nav class="page-nav" data-nav-root></nav>
  <main class="page-shell">
        <div class="container" style="text-align:center; padding-top:40px;">
          <div class="section-title" style="font-size: clamp(2.4rem, 7vw, 5rem);">Hey Risha, my Lado Rani! ❤️</div>
          <p class="subtitle" style="max-width:680px; margin: 0 auto 18px; font-size:1.2rem;">Someone has created something special just for you...</p>
          <div class="hero-envelope" aria-label="romantic envelope">
            <div class="envelope-body"></div>
            <div class="envelope-seal"></div>
          </div>
          <div class="card-image" style="max-width:360px; margin: 0 auto 18px; border-radius: 26px; overflow:hidden; box-shadow:0 18px 36px rgba(147,93,123,.2);">
            <img class="hero-photo" src="assets/front%20pic/risha-cover.png" alt="Risha's portrait" />
          </div>
          <button id="welcome-button" class="button">Open Your Surprise 🎁</button>
          <section class="panel" style="margin-top:36px; padding:24px; text-align:left;">
            <h2 class="section-title">A Few Favorite Moments 📸</h2>
            <div id="front-photo-grid" class="photo-grid"></div>
          </section>
        </div>
        </main>
  <div id="lightbox" class="lightbox"><div class="lightbox-content"><button id="close-lightbox" type="button" class="button secondary" style="position:absolute;top:12px;right:12px;">Close</button><div class="lightbox-nav"><button type="button" id="prev-photo">←</button><button type="button" id="next-photo">→</button></div><img id="lightbox-img" src="" alt="" /><div id="lightbox-caption" class="lightbox-caption"></div></div></div>
  <script src="js/navigation.js"></script>
  
  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/personal-media.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
